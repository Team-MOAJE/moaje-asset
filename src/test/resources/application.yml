spring:
  kafka:
    listener:
      auto-startup: false
  datasource:
    url: jdbc:h2:mem:moaje_asset_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}

moaje:
  id:
    tsid:
      node: 0
  asset:
    banking:
      tls:
        enabled: false
    reconciliation:
      projection:
        enabled: false
    grpc:
      server:
        port: 0
        tls:
          enabled: false
    kafka:
      topics:
        banking-account-created: account_created_events
        banking-transfer-completed: moaje.banking.transfer-completed
        banking-transfer-failed: moaje.banking.transfer-failed
        banking-transfer-reversed: moaje.banking.transfer-reversed
