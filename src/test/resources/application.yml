spring:
  kafka:
    listener:
      auto-startup: false
  datasource:
    url: jdbc:h2:mem:moaje_asset_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

moaje:
  id:
    tsid:
      node: 0
  asset:
    grpc:
      server:
        port: 0
    kafka:
      topics:
        asset-transfer-requested: moaje.asset.transfer-requested
        banking-transfer-completed: moaje.banking.transfer-completed
        banking-transfer-failed: moaje.banking.transfer-failed
